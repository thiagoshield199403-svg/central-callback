<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Despacho Otimizado COI</title>
  <link rel="stylesheet" href="css/despacho.css">
</head>
<body>
  <header class="topo">
    <div class="marca">COI</div>
    <div class="titulo"><h1>DESPACHO OTIMIZADO</h1></div>
    <div class="fontes-topo">
      <div class="dados" id="dados" title="Situação do arquivo chamadas_incidentes.csv"><span class="ponto"></span><span class="rot-fonte">Chamadas</span><span id="dados-texto">Sem dados</span></div>
      <div class="dados" id="dados-inc" title="Situação do arquivo Incidentes.xlsx"><span class="ponto"></span><span class="rot-fonte">Incidentes</span><span id="dados-inc-texto">não lido</span></div>
    </div>
    <select id="polo" class="polo-sel" aria-label="Polo" title="Polo"><option value="">Todos os polos</option></select>
    <button type="button" class="primario" id="btn-atualizar">Atualizar</button>
    <button type="button" class="icone" id="btn-detalhes" aria-expanded="false" aria-controls="conferencia" title="Detalhes das fontes e exceções"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span class="badge oculto" id="det-badge"></span></button>
    <a class="botao-link" id="btn-central" href="index.html">Central</a>
  </header>

  <div class="pagina">
    <div id="fonte" class="fonte oculto"></div>
    <div id="fonte-inc" class="fonte-inc oculto" aria-live="polite"></div>

    <section class="kpis" aria-label="Resumo operacional">
      <div class="kpi kpi-incs"><div class="val" data-kpi="incs">—</div><div class="txt"><div class="rot">INCs identificadas</div><div class="det" data-kpi-det="incs"></div></div></div>
      <div class="kpi"><div class="val" data-kpi="lotes">—</div><div class="txt"><div class="rot">Lotes</div><div class="det" data-kpi-det="lotes"></div></div></div>
      <div class="kpi alerta-laranja"><div class="val" data-kpi="nao_ident">—</div><div class="txt"><div class="rot">Localização não identificada</div><div class="det">INCs sem bairro reconhecido</div></div></div>
      <div class="kpi"><div class="val" data-kpi="fase">—</div><div class="txt"><div class="rot">Indicação de falta de fase</div><div class="det" data-kpi-det="fase"></div></div></div>
    </section>

    <div class="filtros" id="filtros">
      <select id="f-municipio" aria-label="Município"></select>
      <select id="f-bairro" aria-label="Bairro"></select>
      <select id="f-alimentador" aria-label="Alimentador"></select>
      <select id="f-circuito" aria-label="Circuito"></select>
      <select id="f-prioridade" aria-label="Indicação">
        <option value="">Todas as indicações</option>
        <option value="fase">Falta de fase (confirmada ou possível)</option>
        <option value="fase_confirmada">Falta de fase confirmada</option>
        <option value="risco">Risco de vida (classificado ou indício)</option>
      </select>
      <select id="f-status" aria-label="Status do ADMS"></select>
      <select id="f-equipe" aria-label="Equipe">
        <option value="">Com e sem equipe</option>
        <option value="sem">Sem equipe</option>
        <option value="com">Com equipe</option>
        <option value="inconsistente">Com inconsistência</option>
      </select>
      <input type="search" id="f-busca" placeholder="Buscar INC, rua, bairro, equipe" title="Buscar por INC, rua, bairro ou equipe" autocomplete="off" aria-label="Buscar">
      <button type="button" class="fantasma mini" id="f-limpar" title="Limpar todos os filtros">Limpar filtros</button>
    </div>
    <div class="conferencia oculto" id="conferencia"></div>

    <main id="lotes" aria-label="Lotes por município e bairro"></main>
  </div>

  <footer class="bandeja" id="bandeja">
    <div class="conta"><strong id="sel-n">0</strong> INC(s) selecionada(s)</div>
    <div class="itens" id="sel-itens"></div>
    <button type="button" class="fantasma" id="sel-limpar">Limpar</button>
    <button type="button" class="laranja" id="sel-copiar">Copiar selecionadas</button>
  </footer>
  <input type="file" id="arquivo-manual" accept=".csv,text/csv,.xlsx" class="oculto">
  <div class="toast oculto" id="toast" role="status"></div>

  <script src="js/armazenamento.js"></script>
  <script src="js/localidades-dados.js"></script>
  <script src="js/localidades.js"></script>
  <script src="js/modelos.js"></script>
  <script src="js/nucleo.js"></script>
  <script src="js/despacho-config.js"></script>
  <script src="js/despacho-xlsx.js"></script>
  <script src="js/despacho-incidentes.js"></script>
  <script src="js/despacho-motor.js"></script>
  <script src="js/despacho-app.js"></script>
</body>
</html>
